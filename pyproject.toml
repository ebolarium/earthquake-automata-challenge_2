[build-system]
requires = ["setuptools>=72", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-gated-earthquake-forecast"
version = "0.1.0"
description = "Prospective evidence-gated spatial earthquake forecast test against ETAS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.1",
]

[project.optional-dependencies]
# The historical ETAS package has conflicting Python metadata. The complete
# reference environment is installed only by docker/reference.Dockerfile.
reference = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.15.1",
]
evaluation = [
  "click==8.4.2",
  "decorator==5.3.1",
  "greenlet==3.5.5",
  "lxml==6.1.2",
  "mercantile==1.2.1",
  "obspy==1.5.0",
  "pycsep==0.6.3",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.3.post1",
  "six==1.17.0",
  "sqlalchemy==2.0.52",
  "typing-extensions==4.16.0",
  "tzdata==2026.3",
]
prospective = [
  "boto3==1.43.83",
  "psycopg[binary]==3.3.4",
]
paper = [
  "matplotlib==3.10.8",
  "reportlab==4.4.4",
]

[project.urls]
Source = "https://github.com/ebolarium/earthquake-automata-challenge_2"
Documentation = "https://github.com/ebolarium/earthquake-automata-challenge_2/tree/main/wiki"

[tool.setuptools.packages.find]
where = ["src"]
